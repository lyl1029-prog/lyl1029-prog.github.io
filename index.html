<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Studio — Personal Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    /* ─── Variables ─── */
    :root {
      --bg: #FFFFFF;
      --ink: #111111;
      --ink-2: #666666;
      --ink-3: #AAAAAA;
      --white: #FFFFFF;
      --ease: cubic-bezier(0.25, 0.46, 0.45, 0.94);
      --ease-spring: cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* ─── Reset ─── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; font-size: 16px; }
    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Inter', -apple-system, sans-serif;
      font-weight: 300; line-height: 1.7;
      overflow-x: hidden;
    }

    /* ─── Nav ─── */
    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      display: flex; align-items: center; justify-content: space-between;
      padding: 28px 48px;
      background: transparent;
    }
    .nav-logo {
      font-size: 0.8rem; font-weight: 500; letter-spacing: 0.15em;
      text-transform: uppercase; color: var(--white);
      cursor: pointer; transition: opacity 0.3s;
    }
    .nav-logo:hover { opacity: 0.7; }
    .nav-links { display: flex; list-style: none; gap: 40px; }
    .nav-links a {
      text-decoration: none; color: rgba(255,255,255,0.7);
      font-size: 0.75rem; letter-spacing: 0.12em; text-transform: uppercase;
      transition: color 0.3s;
    }
    .nav-links a:hover { color: var(--white); }
    .nav-admin {
      font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase;
      color: rgba(255,255,255,0.5); text-decoration: none;
      padding: 6px 14px; border: 1px solid rgba(255,255,255,0.3);
      border-radius: 20px; transition: all 0.3s;
    }
    .nav-admin:hover { border-color: rgba(255,255,255,0.8); color: var(--white); }

    /* ─── Hero ─── */
    .hero {
      position: relative; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden;
    }
    .hero-bg {
      position: absolute; inset: 0;
      background-image: url('https://images.unsplash.com/photo-1506905925346-21bda4d32df4?w=1920&q=85');
      background-size: cover; background-position: center;
      transform: scale(1.05);
      transition: transform 8s ease-out;
    }
    .hero.loaded .hero-bg { transform: scale(1); }
    .hero-overlay {
      position: absolute; inset: 0;
      background: rgba(0,0,0,0.35);
    }
    .hero-content {
      position: relative; z-index: 1; text-align: center;
      color: var(--white);
    }
    .hero-label {
      font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase;
      opacity: 0.7; margin-bottom: 20px;
    }
    .hero-title {
      font-size: clamp(2.5rem, 6vw, 5.5rem);
      font-weight: 300; line-height: 1.1;
      margin-bottom: 24px;
    }
    .hero-sub {
      font-size: 0.85rem; color: rgba(255,255,255,0.6);
      letter-spacing: 0.08em;
    }
    .hero-scroll {
      position: absolute; bottom: 40px; left: 50%; transform: translateX(-50%);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      color: rgba(255,255,255,0.4); font-size: 0.65rem;
      letter-spacing: 0.2em; text-transform: uppercase;
    }
    .scroll-line { width: 1px; height: 48px; background: rgba(255,255,255,0.3); animation: scrollPulse 2s ease-in-out infinite; }
    @keyframes scrollPulse { 0%, 100% { opacity: 0.3; transform: scaleY(1); } 50% { opacity: 0.8; transform: scaleY(1.2); } }

    /* ─── Works Grid ─── */
    #works { padding: 0; }
    .works-grid {
      columns: 3 320px; column-gap: 4px;
    }
    .work-item {
      overflow: hidden; position: relative; cursor: pointer;
      break-inside: avoid; margin-bottom: 4px;
      opacity: 0; transform: translateY(30px);
      transition: opacity 0.7s var(--ease), transform 0.7s var(--ease);
    }
    .work-item.visible { opacity: 1; transform: translateY(0); }
    .work-item img {
      width: 100%; height: auto; display: block;
      transition: transform 0.8s var(--ease);
    }
    .work-item:hover img { transform: scale(1.03); }
    .work-overlay {
      position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.5) 0%, transparent 50%);
      opacity: 0; transition: opacity 0.4s;
      display: flex; align-items: flex-end; padding: 24px;
    }
    .work-item:hover .work-overlay { opacity: 1; }
    .work-overlay span {
      font-size: 0.9rem; color: var(--white); font-weight: 300;
      transform: translateY(6px); transition: transform 0.4s;
    }
    .work-item:hover .work-overlay span { transform: translateY(0); }

    /* ─── Video Section ─── */
    #videos { padding: 80px 48px; }
    .section-label { font-size: 0.68rem; letter-spacing: 0.2em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 8px; }
    .section-title { font-size: clamp(1.5rem, 3vw, 2.5rem); font-weight: 300; color: var(--ink); margin-bottom: 40px; }
    .video-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
      gap: 4px;
    }
    .video-item {
      position: relative; overflow: hidden; cursor: pointer;
      aspect-ratio: 16/9; opacity: 0; transform: translateY(30px);
      transition: opacity 0.7s var(--ease), transform 0.7s var(--ease);
    }
    .video-item.visible { opacity: 1; transform: translateY(0); }
    .video-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.8s var(--ease); }
    .video-item:hover img { transform: scale(1.03); }
    .video-play {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.2); transition: background 0.3s;
    }
    .video-item:hover .video-play { background: rgba(0,0,0,0.4); }
    .play-btn {
      width: 48px; height: 48px; border-radius: 50%;
      background: rgba(255,255,255,0.15); border: 1.5px solid rgba(255,255,255,0.5);
      display: flex; align-items: center; justify-content: center;
      transition: transform 0.3s var(--ease-spring), background 0.3s;
    }
    .play-btn svg { width: 16px; height: 16px; fill: var(--white); margin-left: 3px; }
    .video-item:hover .play-btn { transform: scale(1.1); background: rgba(255,255,255,0.25); }
    .video-info {
      position: absolute; bottom: 0; left: 0; right: 0;
      padding: 20px; background: linear-gradient(to top, rgba(0,0,0,0.6), transparent);
      display: flex; flex-direction: column; gap: 2px;
    }
    .video-info span { font-size: 1rem; color: var(--white); font-weight: 300; }
    .video-info p { font-size: 0.7rem; color: rgba(255,255,255,0.6); }

    /* ─── Projects ─── */
    #projects { padding: 80px 48px; }
    .projects-list { display: flex; flex-direction: column; }
    .project-card {
      display: flex; justify-content: space-between; align-items: center;
      padding: 28px 0; border-bottom: 1px solid #F0F0F0;
      text-decoration: none; color: var(--ink);
      opacity: 0; transform: translateX(-20px);
      transition: opacity 0.6s var(--ease), transform 0.6s var(--ease), padding-left 0.4s var(--ease);
    }
    .project-card.visible { opacity: 1; transform: translateX(0); }
    .project-card:hover { padding-left: 12px; }
    .project-left { max-width: 600px; }
    .project-name { font-size: clamp(1.4rem, 2.5vw, 2rem); margin-bottom: 6px; font-weight: 300; transition: color 0.3s; }
    .project-card:hover .project-name { color: var(--ink-2); }
    .project-desc { font-size: 0.85rem; color: var(--ink-3); margin-bottom: 12px; }
    .project-tags { display: flex; gap: 6px; flex-wrap: wrap; }
    .tag {
      font-size: 0.62rem; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 3px 8px; border: 1px solid #E0E0E0; border-radius: 20px; color: var(--ink-3);
    }
    .project-meta { display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
    .project-year { font-size: 0.75rem; color: var(--ink-3); }
    .project-arrow {
      width: 32px; height: 32px; display: flex; align-items: center; justify-content: center;
      border: 1px solid #E0E0E0; border-radius: 50%; transition: all 0.3s;
    }
    .project-arrow svg { width: 12px; height: 12px; stroke: var(--ink-3); transition: stroke 0.3s; }
    .project-card:hover .project-arrow { background: var(--ink); border-color: var(--ink); transform: rotate(-45deg); }
    .project-card:hover .project-arrow svg { stroke: var(--white); }

    /* ─── About ─── */
    #about { padding: 80px 48px; }
    .about-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }
    .about-text p { font-size: 0.95rem; color: var(--ink-2); margin-bottom: 18px; line-height: 1.9; }
    .about-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 24px; margin-top: 36px; border-top: 1px solid #F0F0F0; padding-top: 28px; }
    .stat { text-align: left; }
    .stat-number { font-size: 2.2rem; font-weight: 300; color: var(--ink); line-height: 1; }
    .stat-label { font-size: 0.65rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-3); margin-top: 4px; }
    .about-image { overflow: hidden; }
    .about-image img { width: 100%; height: 560px; object-fit: cover; display: block; }

    /* ─── Footer ─── */
    footer { background: #111; padding: 48px; display: flex; justify-content: space-between; align-items: center; }
    .footer-logo { font-size: 0.8rem; font-weight: 500; letter-spacing: 0.15em; text-transform: uppercase; color: var(--white); margin-bottom: 4px; }
    .footer-copy { font-size: 0.7rem; color: rgba(255,255,255,0.3); }
    .footer-links { display: flex; gap: 28px; }
    .footer-links a { font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.4); text-decoration: none; transition: color 0.3s; }
    .footer-links a:hover { color: var(--white); }

    /* ─── Lightbox ─── */
    .lightbox {
      position: fixed; inset: 0; z-index: 300;
      background: rgba(0,0,0,0.96);
      display: flex; align-items: center; justify-content: center;
      opacity: 0; pointer-events: none; transition: opacity 0.35s;
    }
    .lightbox.active { opacity: 1; pointer-events: all; }
    .lightbox img { max-width: 90vw; max-height: 90vh; object-fit: contain; }
    .lightbox-close, .lightbox-nav {
      position: absolute; background: rgba(255,255,255,0.1);
      border: none; border-radius: 50%; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.3s; color: var(--white);
    }
    .lightbox-close { top: 24px; right: 24px; width: 40px; height: 40px; }
    .lightbox-nav { top: 50%; transform: translateY(-50%); width: 44px; height: 44px; }
    .lightbox-prev { left: 24px; }
    .lightbox-next { right: 24px; }
    .lightbox-close:hover, .lightbox-nav:hover { background: rgba(255,255,255,0.25); }
    .lightbox-close svg, .lightbox-nav svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; }

    /* ─── Edit Mode ─── */
    body.edit-mode [contenteditable]:focus { outline: 2px dashed #333; outline-offset: 2px; background: rgba(0,0,0,0.03); }
    body.edit-mode [contenteditable] { cursor: text; }
    [contenteditable="true"] { cursor: pointer; }
    body:not(.edit-mode) [contenteditable] { cursor: pointer; }
    body:not(.edit-mode) [contenteditable]:focus { outline: none; background: transparent; }
    body.edit-mode .work-overlay { opacity: 1 !important; }

    #editToggle {
      position: fixed; bottom: 24px; left: 24px; z-index: 9998;
      background: #111; color: #FFF;
      border: none; border-radius: 24px;
      padding: 10px 18px; font-size: 0.7rem; letter-spacing: 0.1em;
      cursor: pointer; text-transform: uppercase;
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      transition: background 0.3s, transform 0.2s;
    }
    #editToggle:hover { background: #333; transform: scale(1.03); }

    /* ─── Responsive ─── */
    @media (max-width: 900px) {
      .about-grid { grid-template-columns: 1fr; gap: 40px; }
      .about-image img { height: 400px; }
      .about-stats { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 768px) {
      nav { padding: 20px 24px; }
      .works-grid { columns: 2 200px; }
      .video-grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
      .project-meta { display: none; }
      .project-card:hover { padding-left: 0; }
      #videos, #projects, #about { padding: 60px 24px; }
      footer { flex-direction: column; gap: 28px; align-items: flex-start; padding: 40px 24px; }
    }
    @media (max-width: 600px) {
      .works-grid { columns: 1; }
      .video-grid { grid-template-columns: 1fr; }
      .nav-links { display: none; }
      .about-stats { grid-template-columns: repeat(2, 1fr); }
      .about-image img { height: 300px; }
    }
  </style>
</head>
<body>

<button id="editToggle">Edit</button>

<!-- Navigation -->
<nav>
  <div class="nav-logo" id="navLogo">Studio</div>
  <ul class="nav-links">
    <li><a href="#works">Works</a></li>
    <li><a href="#videos">Motion</a></li>
    <li><a href="#projects">Projects</a></li>
    <li><a href="#about">About</a></li>
  </ul>
  <a href="admin/" class="nav-admin">CMS</a>
</nav>

<!-- Hero -->
<section class="hero" id="hero">
  <div class="hero-bg"></div>
  <div class="hero-overlay"></div>
  <div class="hero-content">
    <p class="hero-label" id="heroLabel">Visual Artist</p>
    <h1 class="hero-title" id="heroTitle">Studio</h1>
    <p class="hero-sub" id="heroSub">Based in Shanghai</p>
  </div>
  <div class="hero-scroll">
    <span>Scroll</span>
    <div class="scroll-line"></div>
  </div>
</section>

<!-- Works -->
<section id="works">
  <div class="works-grid" id="worksGrid"></div>
</section>

<!-- Videos -->
<section id="videos">
  <p class="section-label">Motion</p>
  <h2 class="section-title">Video Works</h2>
  <div class="video-grid" id="videoGrid"></div>
</section>

<!-- Projects -->
<section id="projects">
  <p class="section-label">Portfolio</p>
  <h2 class="section-title">Selected Projects</h2>
  <div class="projects-list" id="projectsList"></div>
</section>

<!-- About -->
<section id="about">
  <div class="about-grid">
    <div>
      <p class="section-label" id="aboutLabel">About</p>
      <h2 class="section-title" id="aboutTitle">The Practice</h2>
      <div class="about-text" id="aboutText"></div>
    </div>
    <div class="about-image">
      <img src="" alt="Portrait" id="aboutPortrait">
    </div>
  </div>
</section>

<!-- Footer -->
<footer>
  <div>
    <div class="footer-logo" id="footerLogo">Studio</div>
    <p class="footer-copy" id="footerCopy">&copy; 2024 Studio. All rights reserved.</p>
  </div>
  <div class="footer-links" id="footerLinks"></div>
</footer>

<!-- Lightbox -->
<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">
    <svg viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
  </button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev">
    <svg viewBox="0 0 24 24"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <img src="" alt="" id="lightboxImg">
  <button class="lightbox-nav lightbox-next" id="lightboxNext">
    <svg viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>
  </button>
</div>

<script>
// ── CMS Data Loader ──
const CMS = {
  async loadAll() {
    const [site, works, videos, projects] = await Promise.all([
      fetch('data/site.json').then(r => r.json()),
      fetch('data/works.json').then(r => r.json()),
      fetch('data/videos.json').then(r => r.json()),
      fetch('data/projects.json').then(r => r.json()),
    ]);
    return { site, works, videos, projects };
  },

  renderHero(siteData) {
    const s = siteData.site;
    if (!s) return;
    document.getElementById('navLogo').textContent = s.logo || 'Studio';
    document.getElementById('heroLabel').textContent = s.label || '';
    document.getElementById('heroTitle').textContent = s.title || 'Studio';
    document.getElementById('heroSub').textContent = s.subtitle || '';
    // Hero background
    const heroBg = document.querySelector('.hero-bg');
    if (s.heroBg) {
      heroBg.style.backgroundImage = `url('${s.heroBg}')`;
    }
  },

  renderWorks(works) {
    const grid = document.getElementById('worksGrid');
    if (!works.items || works.items.length === 0) {
      grid.innerHTML = '<p style="padding:48px;color:#AAA;font-size:.85rem">No works yet.</p>';
      return;
    }
    grid.innerHTML = works.items.map(w => `
      <div class="work-item" data-src="${w.fullSrc || w.src || ''}" data-id="${w.id || ''}">
        <img src="${w.src || ''}" alt="${w.alt || w.caption || ''}">
        <div class="work-overlay"><span>${w.caption || ''}</span></div>
      </div>
    `).join('');
    observeNewItems('#worksGrid .work-item');
    bindLightbox();
  },

  renderVideos(videos) {
    const grid = document.getElementById('videoGrid');
    if (!videos.items || videos.items.length === 0) return;
    grid.innerHTML = videos.items.map(v => `
      <div class="video-item" data-id="${v.id || ''}" data-link="${v.link || '#'}">
        <img src="${v.src || ''}" alt="${v.title || ''}">
        <div class="video-play"><div class="play-btn"><svg viewBox="0 0 24 24"><polygon points="5,3 19,12 5,21"/></svg></div></div>
        <div class="video-info"><span>${v.title || ''}</span><p>${v.subtitle || ''}</p></div>
      </div>
    `).join('');
    observeNewItems('#videoGrid .video-item');
    // Video click → open link
    document.querySelectorAll('.video-item').forEach(item => {
      item.addEventListener('click', () => {
        const link = item.dataset.link;
        if (link && link !== '#') window.open(link, '_blank');
      });
    });
  },

  renderProjects(projects) {
    const list = document.getElementById('projectsList');
    if (!projects.items || projects.items.length === 0) return;
    list.innerHTML = projects.items.map(p => `
      <a href="${p.link || '#'}" target="_blank" class="project-card" data-id="${p.id || ''}">
        <div class="project-left">
          <h3 class="project-name">${p.name || p.title || ''}</h3>
          <p class="project-desc">${p.desc || ''}</p>
          <div class="project-tags">
            ${(p.tags || []).map(t => `<span class="tag">${t}</span>`).join('')}
          </div>
        </div>
        <div class="project-meta">
          <span class="project-year">${p.year || ''}</span>
          <div class="project-arrow"><svg viewBox="0 0 24 24"><line x1="7" y1="17" x2="17" y2="7"/><polyline points="7,7 17,7 17,17"/></svg></div>
        </div>
      </a>
    `).join('');
    observeNewItems('#projectsList .project-card');
  },

  renderAbout(siteData) {
    const a = siteData.about;
    if (!a) return;
    document.getElementById('aboutLabel').textContent = a.sectionLabel || '';
    document.getElementById('aboutTitle').textContent = a.sectionTitle || '';
    if (a.portrait) document.getElementById('aboutPortrait').src = a.portrait;
    const textDiv = document.getElementById('aboutText');
    const statsHtml = (a.stats || []).map(s => `
      <div class="stat">
        <div class="stat-number">${s.number || s.value || ''}</div>
        <div class="stat-label">${s.label || ''}</div>
      </div>
    `).join('');
    textDiv.innerHTML = (a.paragraphs || []).map(p => `<p>${p}</p>`).join('') +
      (statsHtml ? `<div class="about-stats">${statsHtml}</div>` : '');
  },

  renderFooter(siteData) {
    const f = siteData.footer;
    if (!f) return;
    document.getElementById('footerLogo').textContent = f.logo || 'Studio';
    document.getElementById('footerCopy').textContent = f.copyright || '';
    document.getElementById('footerLinks').innerHTML = (f.links || []).map(l =>
      `<a href="${l.href || '#'}" target="_blank">${l.label || ''}</a>`
    ).join('');
  }
};

// ── Scroll Reveal ──
let observer;
function initObserver() {
  observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        const delay = parseInt(entry.target.dataset.delay || 0);
        setTimeout(() => entry.target.classList.add('visible'), delay);
        observer.unobserve(entry.target);
      }
    });
  }, { threshold: 0.08 });
  observeNewItems('.work-item, .video-item, .project-card');
}
function observeNewItems(selector) {
  document.querySelectorAll(selector).forEach((el, i) => {
    if (!el.dataset.delay) {
      el.dataset.delay = (i % 4) * 100;
      observer.observe(el);
    }
  });
}

// ── Lightbox ──
let workItems = [];
let currentIndex = 0;
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightboxImg');

function bindLightbox() {
  workItems = [...document.querySelectorAll('.work-item')];
  workItems.forEach((item, i) => {
    item.addEventListener('click', () => {
      if (document.body.classList.contains('edit-mode')) return;
      openLightbox(i);
    });
  });
}
function openLightbox(index) {
  if (!workItems.length) return;
  currentIndex = index;
  lightboxImg.src = workItems[currentIndex].dataset.src || '';
  lightbox.classList.add('active');
}
function closeLightbox() { lightbox.classList.remove('active'); }

document.getElementById('lightboxClose').addEventListener('click', closeLightbox);
document.getElementById('lightboxPrev').addEventListener('click', () => {
  currentIndex = (currentIndex - 1 + workItems.length) % workItems.length;
  lightboxImg.src = workItems[currentIndex].dataset.src || '';
});
document.getElementById('lightboxNext').addEventListener('click', () => {
  currentIndex = (currentIndex + 1) % workItems.length;
  lightboxImg.src = workItems[currentIndex].dataset.src || '';
});
lightbox.addEventListener('click', (e) => { if (e.target === lightbox) closeLightbox(); });
document.addEventListener('keydown', (e) => {
  if (!lightbox.classList.contains('active')) return;
  if (e.key === 'Escape') closeLightbox();
  if (e.key === 'ArrowLeft') document.getElementById('lightboxPrev').click();
  if (e.key === 'ArrowRight') document.getElementById('lightboxNext').click();
});

// ── Edit Mode ──
(function() {
  const toggle = document.getElementById('editToggle');
  const SELECTORS = 'h1,h2,h3,h4,h5,p,span,a,li,em,strong,small,div,figcaption';
  let editable = [];

  function enableEdit() {
    document.body.classList.add('edit-mode');
    editable = [...document.querySelectorAll(SELECTORS)].filter(el => {
      return !el.closest('script,style,nav,.video-item,.lightbox,#editToggle,.hero,.hero-content');
    });
    editable.forEach(el => el.setAttribute('contenteditable', 'true'));
    toggle.textContent = 'Done';
  }

  function disableEdit() {
    document.body.classList.remove('edit-mode');
    editable.forEach(el => el.setAttribute('contenteditable', 'false'));
    editable = [];
    toggle.textContent = 'Edit';
  }

  toggle.addEventListener('click', () => {
    document.body.classList.contains('edit-mode') ? disableEdit() : enableEdit();
  });
})();

// ── Boot ──
initObserver();

// Hero subtle animation on load
window.addEventListener('load', () => {
  document.getElementById('hero').classList.add('loaded');
});

CMS.loadAll().then(data => {
  CMS.renderHero(data);
  CMS.renderWorks(data.works);
  CMS.renderVideos(data.videos);
  CMS.renderProjects(data.projects);
  CMS.renderAbout(data);
  CMS.renderFooter(data);
}).catch(err => {
  console.error('CMS load failed:', err);
  document.getElementById('worksGrid').innerHTML =
    '<p style="padding:48px;color:#AAA;font-size:.85rem;text-align:center">Failed to load data. Make sure you are running on a local server (e.g. Live Server).</p>';
});
</script>
